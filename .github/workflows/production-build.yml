name: Production Build & Sign

on:
  push:
    branches: [ main, 'ci/onedir-*' ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

env:
  FACENOX_BACKEND_LAYOUT: ${{ startsWith(github.ref_name, 'ci/onedir-') && 'onedir' || vars.FACENOX_BACKEND_LAYOUT || 'onefile' }}

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Install App Dependencies
        run: |
          cd app
          pnpm install

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install Server Dependencies
        run: |
          cd server
          pip install -r requirements-dev.txt

      - name: Lint App
        run: |
          cd app
          pnpm run lint

      - name: Lint Server
        run: |
          cd server
          ruff check

      - name: Test App
        run: |
          cd app
          pnpm run test
          
      - name: Test Server
        run: |
          cd server
          npm run test

  build-backend:
    name: Build Backend (${{ matrix.os }} - ${{ matrix.arch }})
    needs: lint-and-test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            arch: x64
          - os: macos-26-intel
            arch: x64
          - os: macos-latest
            arch: arm64
          - os: ubuntu-24.04
            arch: x64
    steps:
      - uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Test Dependencies
        run: |
          cd server
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Test Native Migration And Key Storage
        run: |
          cd server
          python -m pytest -q tests/test_safe_migrations.py tests/test_bootstrap.py tests/test_alembic_heads.py

      - name: Build Executable
        shell: bash
        working-directory: server
        run: |
          case "$FACENOX_BACKEND_LAYOUT" in
            onedir) python build_backend.py --onedir --test; artifact=server-onedir ;;
            onefile)
              python build_backend.py --test
              artifact=server
              if [ "$RUNNER_OS" = 'Windows' ]; then artifact=server.exe; fi
              ;;
            *) echo "Unknown backend layout: $FACENOX_BACKEND_LAYOUT"; exit 1 ;;
          esac
          tar -C dist -cf backend.tar "$artifact"

      - name: Upload Backend Artifact
        uses: actions/upload-artifact@v7
        with:
          name: backend-${{ matrix.os }}-${{ matrix.arch }}
          path: server/backend.tar
          if-no-files-found: error

  build-electron:
    name: Build Electron (${{ matrix.os }} - ${{ matrix.arch }})
    needs: build-backend
    runs-on: ${{ matrix.os }}
    env:
      HAS_MACOS_SIGNING: ${{ secrets.MACOS_CSC_LINK != '' && secrets.MACOS_CSC_KEY_PASSWORD != '' && secrets.APPLE_ID != '' && secrets.APPLE_APP_SPECIFIC_PASSWORD != '' && secrets.APPLE_TEAM_ID != '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            arch: x64
          - os: macos-26-intel
            arch: x64
          - os: macos-latest
            arch: arm64
          - os: ubuntu-24.04
            arch: x64
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Check Checkout Line Endings
        run: node scripts/check-line-endings.mjs

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Download Backend Artifact
        uses: actions/download-artifact@v8
        with:
          name: backend-${{ matrix.os }}-${{ matrix.arch }}
          path: server/dist/

      - name: Extract Backend Artifact
        working-directory: server/dist
        run: tar -xf backend.tar

      - name: Install Dependencies
        run: |
          cd app
          pnpm install

      - name: Test Native Storage Paths and Branding
        run: |
          cd app
          pnpm exec vitest run src/electron/paths.test.ts src/electron/ipc/systemHandlers.test.ts src/electron/appBranding.test.ts

      - name: Build App
        run: |
          cd app
          npm run build

      - name: Package CI build
        if: runner.os != 'macOS' || !startsWith(github.ref, 'refs/tags/v') || env.HAS_MACOS_SIGNING != 'true'
        run: |
          cd app
          if [ "${{ matrix.os }}" == "ubuntu-24.04" ]; then
            npx electron-builder --linux deb AppImage --publish never
          elif [ "${{ matrix.os }}" == "macos-latest" ]; then
            npx electron-builder --mac --arm64 --publish never
          elif [ "${{ matrix.os }}" == "macos-26-intel" ]; then
            npx electron-builder --mac --x64 --publish never
          else
            npx electron-builder --win --x64 --publish never
          fi
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          FACENOX_PREBUILT_BACKEND: "1"

      - name: Sign and notarize macOS release
        if: runner.os == 'macOS' && startsWith(github.ref, 'refs/tags/v') && env.HAS_MACOS_SIGNING == 'true'
        shell: bash
        working-directory: app
        env:
          FACENOX_PREBUILT_BACKEND: "1"
          CSC_LINK: ${{ secrets.MACOS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MACOS_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          : "${CSC_LINK:?Missing macOS Developer ID certificate}"
          : "${CSC_KEY_PASSWORD:?Missing macOS certificate password}"
          : "${APPLE_ID:?Missing Apple ID}"
          : "${APPLE_APP_SPECIFIC_PASSWORD:?Missing notarization password}"
          : "${APPLE_TEAM_ID:?Missing Apple Team ID}"
          pnpm exec electron-builder --mac --${{ matrix.arch }} --publish never -c.forceCodeSigning=true
          app_bundle="$(find dist -type d -name 'Facenox.app' -print -quit)"
          test -n "$app_bundle"
          codesign --verify --deep --strict "$app_bundle"
          xcrun stapler validate "$app_bundle"

      - name: Set up Python for installer smoke test
        if: env.FACENOX_BACKEND_LAYOUT == 'onedir'
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Test onedir installation and upgrade
        if: env.FACENOX_BACKEND_LAYOUT == 'onedir'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          case "$RUNNER_OS" in
            Windows) pattern='*-Windows-*-x64.exe' ;;
            macOS)
              pattern="*-macOS-*-${{ matrix.arch }}.dmg"
              if [[ "$GITHUB_REF" != refs/tags/v* ]]; then
                # The CI preview has a different signing identity from the previous release.
                # Use the file-provider fallback to exercise upgrades without a Keychain prompt.
                export PYTHON_KEYRING_BACKEND=keyring.backends.fail.Keyring
              fi
              ;;
            Linux) pattern='*-Linux-*-amd64.deb' ;;
          esac
          gh release download v1.0.0-beta.27 --pattern "$pattern" --dir previous-installer
          python scripts/check-installer.py previous-installer/$pattern app/dist/$pattern

      - name: Upload App Package
        uses: actions/upload-artifact@v7
        with:
          name: ${{ runner.os == 'Windows' && 'unsigned-app' || 'app-package' }}-${{ matrix.os }}-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            app/dist/*.exe
            app/dist/*.dmg
            app/dist/*.AppImage
            app/dist/*.deb

  sign-and-release:
    name: Sign & Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-electron
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      HAS_SIGNPATH: ${{ secrets.SIGNPATH_API_TOKEN != '' && secrets.SIGNPATH_ORGANIZATION_ID != '' && secrets.SIGNPATH_PROJECT_SLUG != '' && secrets.SIGNPATH_SIGNING_POLICY_SLUG != '' }}
    steps:
      - uses: actions/checkout@v7
      
      - name: Submit to SignPath (Windows)
        if: env.HAS_SIGNPATH == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        id: sign-windows
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ secrets.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ secrets.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-name: 'unsigned-app-windows-latest-x64'
          wait-for-completion: true
          download-signed-artifact-path: 'signed/windows'

      - name: Download Original Artifacts
        uses: actions/download-artifact@v8
        with:
          path: original-artifacts/

      - name: Prepare Release Assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          if compgen -G "signed/windows/*.exe" > /dev/null; then
            cp signed/windows/*.exe release-assets/
          else
            cp original-artifacts/unsigned-app-windows-latest-x64/*.exe release-assets/
          fi
          cp original-artifacts/app-package-macos-26-intel-x64/*.dmg release-assets/
          cp original-artifacts/app-package-macos-latest-arm64/*.dmg release-assets/
          cp original-artifacts/app-package-ubuntu-24.04-x64/*.AppImage release-assets/
          cp original-artifacts/app-package-ubuntu-24.04-x64/*.deb release-assets/
          ls -lh release-assets

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: release-assets/*
          generate_release_notes: false
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
