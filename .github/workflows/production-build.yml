name: Production Build & Sign

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Install App Dependencies
        run: |
          cd app
          pnpm install

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install Server Dependencies
        run: |
          cd server
          pip install -r requirements-dev.txt

      - name: Lint App
        run: |
          cd app
          pnpm run lint

      - name: Lint Server
        run: |
          cd server
          ruff check

      - name: Test App
        run: |
          cd app
          pnpm run test
          
      - name: Test Server
        run: |
          cd server
          npm run test

  build-backend:
    name: Build Backend (${{ matrix.os }} - ${{ matrix.arch }})
    needs: lint-and-test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            arch: x64
          - os: macos-latest
            arch: x64
          - os: macos-14
            arch: arm64
          - os: ubuntu-24.04
            arch: x64
    steps:
      - uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          cd server
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-build.txt

      - name: Build Executable
        run: |
          cd server
          python build_backend.py

      - name: Upload Backend Artifact
        uses: actions/upload-artifact@v7
        with:
          name: backend-${{ matrix.os }}-${{ matrix.arch }}
          path: server/dist/server*

  build-electron:
    name: Build Electron (${{ matrix.os }} - ${{ matrix.arch }})
    needs: build-backend
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            arch: x64
          - os: macos-latest
            arch: x64
          - os: macos-14
            arch: arm64
          - os: ubuntu-24.04
            arch: x64
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Download Backend Artifact
        uses: actions/download-artifact@v8
        with:
          name: backend-${{ matrix.os }}-${{ matrix.arch }}
          path: server/dist/

      - name: Install Dependencies
        run: |
          cd app
          pnpm install

      - name: Build App
        run: |
          cd app
          npm run build

      - name: Package App
        run: |
          cd app
          if [ "${{ matrix.os }}" == "ubuntu-24.04" ]; then
            npx electron-builder --linux deb AppImage --publish never
          elif [ "${{ matrix.os }}" == "macos-14" ]; then
            npx electron-builder --mac --arm64 --publish never
          elif [ "${{ matrix.os }}" == "macos-latest" ]; then
            npx electron-builder --mac --x64 --publish never
          else
            npx electron-builder --win --x64 --publish never
          fi
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Unsigned App
        uses: actions/upload-artifact@v7
        with:
          name: unsigned-app-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            app/dist/*.exe
            app/dist/*.dmg
            app/dist/*.AppImage
            app/dist/*.deb

  sign-and-release:
    name: Sign & Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-electron
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      
      # Windows Signing (Placeholder/Optional)
      - name: Submit to SignPath (Windows)
        uses: signpath/github-action-submit-signing-request@v3
        id: sign-windows
        continue-on-error: true
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ secrets.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ secrets.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-name: 'unsigned-app-windows-latest-x64'
          wait-for-completion: true
          download-signed-artifact-path: 'signed/windows'

      # Download all original artifacts for fallback
      - name: Download Original Artifacts
        uses: actions/download-artifact@v8
        with:
          path: original-artifacts/

      # Create GitHub Release
      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            signed/windows/*.exe
            original-artifacts/unsigned-app-windows-latest-x64/*.exe
            original-artifacts/unsigned-app-macos-latest-x64/*.dmg
            original-artifacts/unsigned-app-macos-14-arm64/*.dmg
            original-artifacts/unsigned-app-ubuntu-24.04-x64/*.AppImage
            original-artifacts/unsigned-app-ubuntu-24.04-x64/*.deb
          generate_release_notes: true
          draft: false
          prerelease: false
          fail_on_unmatched_files: false
