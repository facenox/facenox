name: Production Build & Sign

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Install App Dependencies
        run: |
          cd app
          pnpm install

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install Server Dependencies
        run: |
          cd server
          pip install -r requirements-dev.txt

      - name: Lint App
        run: |
          cd app
          pnpm run lint

      - name: Lint Server
        run: |
          cd server
          ruff check

      - name: Test App
        run: |
          cd app
          pnpm run test
          
      - name: Test Server
        run: |
          cd server
          npm run test

  build-backend:
    name: Build Backend (${{ matrix.os }} - ${{ matrix.arch }})
    needs: lint-and-test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            arch: x64
          - os: macos-26-intel
            arch: x64
          - os: macos-latest
            arch: arm64
          - os: ubuntu-24.04
            arch: x64
    steps:
      - uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Test Dependencies
        run: |
          cd server
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Test Native Migration And Key Storage
        run: |
          cd server
          python -m pytest -q tests/test_safe_migrations.py tests/test_bootstrap.py tests/test_alembic_heads.py

      - name: Build Executable
        run: |
          cd server
          python build_backend.py

      - name: Upload Backend Artifact
        uses: actions/upload-artifact@v7
        with:
          name: backend-${{ matrix.os }}-${{ matrix.arch }}
          path: server/dist/server*

  build-electron:
    name: Build Electron (${{ matrix.os }} - ${{ matrix.arch }})
    needs: build-backend
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            arch: x64
          - os: macos-26-intel
            arch: x64
          - os: macos-latest
            arch: arm64
          - os: ubuntu-24.04
            arch: x64
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Check Checkout Line Endings
        run: node scripts/check-line-endings.mjs

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Download Backend Artifact
        uses: actions/download-artifact@v8
        with:
          name: backend-${{ matrix.os }}-${{ matrix.arch }}
          path: server/dist/

      - name: Install Dependencies
        run: |
          cd app
          pnpm install

      - name: Test Native Storage Paths and Branding
        run: |
          cd app
          pnpm exec vitest run src/electron/paths.test.ts src/electron/ipc/systemHandlers.test.ts src/electron/appBranding.test.ts

      - name: Build App
        run: |
          cd app
          npm run build

      - name: Package CI build
        if: runner.os != 'macOS' || !startsWith(github.ref, 'refs/tags/v')
        run: |
          cd app
          if [ "${{ matrix.os }}" == "ubuntu-24.04" ]; then
            npx electron-builder --linux deb AppImage --publish never
          elif [ "${{ matrix.os }}" == "macos-latest" ]; then
            npx electron-builder --mac --arm64 --publish never
          elif [ "${{ matrix.os }}" == "macos-26-intel" ]; then
            npx electron-builder --mac --x64 --publish never
          else
            npx electron-builder --win --x64 --publish never
          fi
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Sign and notarize macOS release
        if: runner.os == 'macOS' && startsWith(github.ref, 'refs/tags/v')
        shell: bash
        working-directory: app
        env:
          CSC_LINK: ${{ secrets.MACOS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MACOS_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          : "${CSC_LINK:?Missing macOS Developer ID certificate}"
          : "${CSC_KEY_PASSWORD:?Missing macOS certificate password}"
          : "${APPLE_ID:?Missing Apple ID}"
          : "${APPLE_APP_SPECIFIC_PASSWORD:?Missing notarization password}"
          : "${APPLE_TEAM_ID:?Missing Apple Team ID}"
          pnpm exec electron-builder --mac --${{ matrix.arch }} --publish never -c.forceCodeSigning=true
          app_bundle="$(find dist -type d -name 'Facenox.app' -print -quit)"
          test -n "$app_bundle"
          codesign --verify --deep --strict "$app_bundle"
          xcrun stapler validate "$app_bundle"

      - name: Upload App Package
        uses: actions/upload-artifact@v7
        with:
          name: ${{ runner.os == 'Windows' && 'unsigned-app' || 'app-package' }}-${{ matrix.os }}-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            app/dist/*.exe
            app/dist/*.dmg
            app/dist/*.AppImage
            app/dist/*.deb

  sign-and-release:
    name: Sign & Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-electron
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      
      - name: Submit to SignPath (Windows)
        uses: signpath/github-action-submit-signing-request@v3
        id: sign-windows
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ secrets.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ secrets.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-name: 'unsigned-app-windows-latest-x64'
          wait-for-completion: true
          download-signed-artifact-path: 'signed/windows'

      - name: Download Original Artifacts
        uses: actions/download-artifact@v8
        with:
          path: original-artifacts/

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            signed/windows/*.exe
            original-artifacts/app-package-macos-26-intel-x64/*.dmg
            original-artifacts/app-package-macos-latest-arm64/*.dmg
            original-artifacts/app-package-ubuntu-24.04-x64/*.AppImage
            original-artifacts/app-package-ubuntu-24.04-x64/*.deb
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
