<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Facenox</title>
    <link rel="stylesheet" href="./splash.css" />
  </head>

  <body>
    <div class="splash-container">
      <div class="splash-content">
        <div class="logo-pulse-wrapper">
          <img class="logo" id="logo" src="./logo-transparent.png" alt="Facenox" />
        </div>

        <div class="brand-block">
          <div class="status-text" id="status-text">
            Starting<span class="dots"
              ><span class="dot">.</span><span class="dot">.</span><span class="dot">.</span></span
            >
          </div>
          <div class="progress-track" aria-hidden="true">
            <div class="progress-fill" id="progress-fill"></div>
          </div>
        </div>
      </div>
    </div>

    <script>
      const logo = document.getElementById("logo")
      if (logo) {
        logo.addEventListener(
          "error",
          () => {
            logo.src = "../../public/icons/logo-transparent.png"
          },
          { once: true },
        )
      }

      const progressFill = document.getElementById("progress-fill")
      const progressTrack = document.querySelector(".progress-track")
      const container = document.querySelector(".splash-container")
      const statusText = document.getElementById("status-text")

      let currentProgress = 0
      let targetProgress = 0
      let animationFrameId = null
      let lastAnimationTime = performance.now()
      let hasShownProgress = false

      const updateStatusText = (progress) => {
        if (!statusText) return

        let text = "Starting"
        if (progress >= 100) {
          text = "Ready"
        } else if (progress >= 85) {
          text = "Almost ready"
        } else if (progress >= 50) {
          text = "Loading models"
        } else if (progress >= 20) {
          text = "Checking database"
        } else if (progress > 0) {
          text = "Starting"
        }

        const currentText = statusText.childNodes[0]?.textContent?.trim()
        if (currentText !== text) {
          if (text === "Ready") {
            statusText.innerHTML = "Ready"
          } else {
            statusText.innerHTML = `${text}<span class="dots"><span class="dot">.</span><span class="dot">.</span><span class="dot">.</span></span>`
          }
          statusText.style.opacity = 0.5
          setTimeout(() => {
            statusText.style.opacity = 1
          }, 50)
        }
      }

      const renderProgress = () => {
        if (!progressFill) return
        progressFill.style.width = `${currentProgress}%`
        updateStatusText(currentProgress)
      }

      const animateProgress = (timestamp) => {
        const deltaMs = Math.min(timestamp - lastAnimationTime, 48)
        lastAnimationTime = timestamp
        const distance = targetProgress - currentProgress

        if (Math.abs(distance) < 0.15) {
          currentProgress = targetProgress
          renderProgress()
          animationFrameId = null
          return
        }

        const timeConstant = targetProgress === 100 ? 95 : 180
        const smoothing = 1 - Math.exp(-deltaMs / timeConstant)
        const nextProgress = currentProgress + distance * smoothing

        currentProgress =
          targetProgress > currentProgress ?
            Math.min(nextProgress, targetProgress)
          : Math.max(nextProgress, targetProgress)

        renderProgress()
        animationFrameId = window.requestAnimationFrame(animateProgress)
      }

      const startProgressAnimation = () => {
        if (animationFrameId !== null) return
        lastAnimationTime = performance.now()
        animationFrameId = window.requestAnimationFrame(animateProgress)
      }

      const applyProgress = (progress) => {
        if (typeof progress === "number") {
          const clamped = Math.max(0, Math.min(100, progress))
          if (clamped > 0 && !hasShownProgress) {
            hasShownProgress = true
            progressTrack?.classList.add("is-visible")
          }
          if (clamped === 100) {
            targetProgress = 100
            currentProgress = 100
            if (animationFrameId !== null) {
              window.cancelAnimationFrame(animationFrameId)
              animationFrameId = null
            }
            renderProgress()

            if (container) {
              container.classList.add("is-success")
            }

            setTimeout(() => {
              window.facenoxElectron?.reportSplashRenderedProgress?.(100)
            }, 600)
            return
          }

          targetProgress = clamped
          startProgressAnimation()
        }
      }

      renderProgress()

      // Smooth delayed reveal of status details to prioritize primary logo breathing entrance
      setTimeout(() => {
        const brandBlock = document.querySelector(".brand-block")
        if (brandBlock) {
          brandBlock.classList.add("is-visible")
        }
      }, 500)

      // Enable local browser previewing/testing
      if (!window.facenoxElectron) {
        window.facenoxElectron = {
          reportSplashRenderedProgress: (progress) => {
            console.log("[Mock IPC] reportSplashRenderedProgress:", progress)
          },
          onSplashProgress: (callback) => {
            let current = 0
            const interval = setInterval(() => {
              current += 4
              if (current > 100) {
                clearInterval(interval)
              } else {
                callback({ progress: current })
              }
            }, 180)
            return () => clearInterval(interval)
          },
        }
      }

      if (window.facenoxElectron?.onSplashProgress) {
        window.facenoxElectron.onSplashProgress(({ progress }) => {
          applyProgress(progress)
        })
      }
    </script>
  </body>
</html>
